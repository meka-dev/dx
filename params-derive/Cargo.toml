[package]
name              = "params-derive"
version           = "0.1.0"
edition           = "2021"

[lib]
proc-macro        = true

[dependencies]
proc-macro2       = { version = "1.0",  default-features = false }
proc-macro-error  = { version = "1",    default-features = false, features = [ "syn-error" ] }
quote             = { version = "1.0",  default-features = false }
syn               = { version = "1.0",  default-features = false, features = [ "extra-traits", "full", "parsing", "printing" ] }

[dev-dependencies]
axum              = { version = "0.4",  default-features = false, features = [ "headers", "http2", "tower-log" ] }
axum-extra        = { version = "0.1",  default-features = false }
serde             = { version = "1.0",  default-features = false, features = [ "rc" ] }
serde_json        = { version = "1.0",  default-features = false }
tokio             = { version = "1.17", default-features = false, features = [ "macros", "rt-multi-thread", "sync" ] }
trybuild          = { version = "1.0",  default-features = false }
