[package]
name    = "terrars"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait         = { version = "0.1",  default-features = false }
astroport           = { version = "0.3",  default-features = false } # use 0.3 instead of a more recent version for consistency, as it's the version used on chain
base64              = { version = "0.13", default-features = false }
cosmrs              = { version = "0.7",  default-features = false, features = [ "cosmwasm" ], git = "https://github.com/meka-dev/cosmos-rust.git", branch = "xla/expand-types" }
cosmwasm-std        = { version = "0.16", default-features = false }
cosmwasm-bignumber  = { version = "2.2",  default-features = false }
cw20                = { version = "0.8",  default-features = false } # We need 0.8 because the terraswap contracts are still on that version
futures             = { version = "0.3",  default-features = false, features = [ "alloc" ] }
hex                 = { version = "0.4",  default-features = false }
prost               = { version = "0.10", default-features = false }
prost-types         = { version = "0.10", default-features = false }
reqwest             = { version = "0.11", default-features = false, features = [ "default-tls", "json" ] }
serde               = { version = "1.0",  default-features = false }
serde_json          = { version = "1.0",  default-features = false }
serde-json-wasm     = { version = "0.4",  default-features = false }
terraswap           = { version = "2.4",  default-features = false }
tokio               = { version = "1.0",  default-features = false, features = [ "macros", "rt-multi-thread", "sync", "time" ] }
tracing             = { version = "0.1",  default-features = false }

common              = { version = "0.1",  default-features = false, path = "../common" }

[dev-dependencies]
prost-build         = { version = "0.10",  default-features = false }
walkdir             = { version = "2.3",  default-features = false }
wiremock            = { version = "0.5",  default-features = false }
