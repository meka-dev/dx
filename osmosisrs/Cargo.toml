[package]
name    = "osmosisrs"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmrs            = { version = "0.7",  default-features = false, features = [ "cosmwasm" ], git = "https://github.com/meka-dev/cosmos-rust.git", branch = "xla/expand-types" }
prost             = { version = "0.10", default-features = false }
prost-types       = { version = "0.10", default-features = false }
prost-wkt         = { version = "0.3",  default-features = false }
prost-wkt-types   = { version = "0.3",  default-features = false, features = [ "std" ] }
serde             = { version = "1.0",  default-features = false, features = [ "derive", "rc" ] }
tendermint-proto  = { version = "0.23", default-features = false }

