[package]
name    = "backtest"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow              = { version = "1.0",  default-features = false, features = [ "std" ] }
argh                = { version = "0.1",  default-features = false }
bytes               = { version = "1.1",  default-features = false }
cosmwasm-std        = { version = "0.16", default-features = false }
env_logger          = { version = "0.9",  default-features = false }
futures             = { version = "0.3",  default-features = false, features = [ "async-await", "std" ] }
futures-util        = { version = "0.3",  default-features = false }
log                 = { version = "0.4",  default-features = false }
reqwest             = { version = "0.11", default-features = false, features = [ "default-tls", "json", "rustls-tls", "stream" ] }
serde               = { version = "1.0",  default-features = false, features = [ "derive" ] }
serde_json          = { version = "1.0",  default-features = false }
tame-gcs            = { version = "0.11", default-features = false, features = [ "async-multipart", "signing", "v1" ] }
tame-oauth          = { version = "0.7",  default-features = false, features = [ "gcp" ] }
tokio               = { version = "1.0",  default-features = false, features = [ "macros", "rt-multi-thread", "sync", "time" ] }
