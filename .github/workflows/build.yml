name: Build
on:
  push:
    branches:
      - main

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: rokroskar/workflow-run-cleanup-action@master
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    if: "!startsWith(github.ref, 'refs/tags') && github.ref == 'res/heads/main'"

  execution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [execution]
        toolchain: [stable]

    name: build ${{ matrix.task }} on ${{ matrix.os }} with ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - id: version
        shell: bash
        run: 'echo ::set-output "name=VERSION::$(git rev-parse --short HEAD)"'

      - name: Cache toolchain
        uses: actions/cache@v2
        with:
          path: |
            ~/.rustup/settings.toml
            ~/.rustup/toolchains/${{ matrix.toolchain }}-*
            ~/.rustup/update-hashes/${{ matrix.toolchain }}-*
          key: rust-toolchain_${{ matrix.os }}-${{ matrix.toolchain }}

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          components: cargo

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v1

      - name: Compile ${{ matrix.task }}
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release -p execution --bin execution

      - shell: bash
        run: "mv ./target/release/execution ./target/release/execution-${{ steps.version.outputs.VERSION }}"

      - name: Upload ${{ matrix.task }} binary
        uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.SPACE_ACCESS_KEY }}
          secret_key: ${{ secrets.SPACE_SECRET_KEY }}
          space_name: ${{ secrets.SPACE_NAME }}
          space_region: ${{ secrets.SPACE_REGION }}
          source: "./target/release/execution-${{ steps.version.outputs.VERSION }}"
