name: Build
on:
  push:
    branches:
      - main
      - xla/gh-build

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: rokroskar/workflow-run-cleanup-action@master
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    if: "!startsWith(github.ref, 'refs/tags') && github.ref == 'res/heads/main'"

  execution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        task: [execution]
        toolchain: [stable]

    name: build ${{ matrix.task }} on ${{ matrix.os }} with ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Cache toolchain
        uses: actions/cache@v2
        with:
          path: |
            ~/.rustup/settings.toml
            ~/.rustup/toolchains/${{ matrix.toolchain }}-*
            ~/.rustup/update-hashes/${{ matrix.toolchain }}-*
          key: rust-toolchain_${{ matrix.os }}-${{ matrix.toolchain }}

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          components: cargo, rust-src

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v1

      - name: Compile ${{ matrix.task }}
        run: cargo build -p execution --release
