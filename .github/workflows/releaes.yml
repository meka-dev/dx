name: Release
on:
  push:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  collector:
    if: "github.ref == 'refs/heads/main'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04]
        toolchain: [stable]

    name: collector
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - id: version
        shell: bash
        run: 'echo ::set-output "name=VERSION::$(git rev-parse --short HEAD)"'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        id: toolchain
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          components: cargo, rustfmt
          override: true

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: v0-rust-${{ matrix.os }}

      - name: Compile collector
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release -p collector

      - shell: bash
        run: "mv ./target/release/collector ./target/release/collector-${{ steps.version.outputs.VERSION }}"

      - name: Upload collector binary
        uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.SPACE_ACCESS_KEY }}
          secret_key: ${{ secrets.SPACE_SECRET_KEY }}
          space_name: ${{ secrets.SPACE_NAME }}
          space_region: ${{ secrets.SPACE_REGION }}
          source: "./target/release/collector-${{ steps.version.outputs.VERSION }}"

  execution:
    if: "github.ref == 'refs/heads/main'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04]
        toolchain: [stable]

    name: execution
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - id: version
        shell: bash
        run: 'echo ::set-output "name=VERSION::$(git rev-parse --short HEAD)"'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        id: toolchain
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          components: cargo, rustfmt
          override: true

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Compile execution
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release -p execution --bin execution

      - shell: bash
        run: "mv ./target/release/execution ./target/release/execution-${{ steps.version.outputs.VERSION }}"

      - name: Upload execution binary
        uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.SPACE_ACCESS_KEY }}
          secret_key: ${{ secrets.SPACE_SECRET_KEY }}
          space_name: ${{ secrets.SPACE_NAME }}
          space_region: ${{ secrets.SPACE_REGION }}
          source: "./target/release/execution-${{ steps.version.outputs.VERSION }}"
