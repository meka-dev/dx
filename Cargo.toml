[workspace]

members = [
  "address-book",
  "blocketl",
  "chainrs",
  "collector",
  "common",
  "contracts/arby",
  "execution",
  "lcd",
  "mekapi",
  "params-derive",
  "proto-build",
  "terrars"
]

[profile.release]
lto = "fat"

[profile.bench]
debug = true

[profile.release.package.arby]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
# lto = true # cant set lto for a package
opt-level = 3
overflow-checks = true
# panic = 'abort' # wasm32 is panic abort default
# rpath = false # off by default?
