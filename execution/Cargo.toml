[package]
name    = "execution"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[dependencies]
anyhow              = { version = "1.0",  default-features = false }
argh                = { version = "0.1",  default-features = false }
axum                = { version = "0.4",  default-features = false, features = [ "headers", "http2", "tower-log" ] }
axum-extra          = { version = "0.1",  default-features = false }
astroport           = { version = "1.0",  default-features = false }
async-trait         = { version = "0.1",  default-features = false }
cosmwasm-std        = { version = "0.16", default-features = false }
cosmwasm-bignumber  = { version = "2.2", default-features = false }
cw20                = { version = "0.8", default-features = false } # We need 0.8 because the terraswap contracts are still on that version
cw20-base           = { version = "0.8", default-features = false }
env_logger          = { version = "0.9",  default-features = false }
futures             = { version = "0.3",  default-features = false }
itertools           = { version = "0.10", default-features = false }
hyper               = { version = "0.14", default-features = false }
lazy_static         = { version = "1.4",  default-features = false }
log                 = { version = "0.4",  default-features = false }
num_cpus            = { version = "1.0",  default-features = false }
prometheus-client   = { version = "0.15", default-features = false }
serde               = { version = "1.0",  default-features = false }
serde_json          = { version = "1.0",  default-features = false }
tendermint          = { version = "0.23", default-features = false }
tendermint-rpc      = { version = "0.23", default-features = true,  features = [ "websocket-client" ] }
terraswap           = { version = "2.4",  default-features = false }
thiserror           = { version = "1.0",  default-features = false }
tokio               = { version = "1.0",  default-features = false, features = [ "macros", "rt-multi-thread", "sync", "time" ] }

terrars             = { version = "0.1", default-features = false, path = "../terrars" }
