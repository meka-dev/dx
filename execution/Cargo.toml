[package]
name    = "execution"
version = "0.1.0"
edition = "2021"

[dependencies]
argh                = { version = "0.1",  default-features = false }
async-trait         = { version = "0.1",  default-features = false }
axum                = { version = "0.5",  default-features = false, features = [ "headers", "http2", "json", "tower-log" ] }
backoff             = { version = "0.4",  default-features = false, features = [ "async-std", "futures" ] }
base64              = { version = "0.13", default-features = false }
cosmrs              = { version = "0.7",  default-features = false, features = [ "cosmwasm" ], git = "https://github.com/meka-dev/cosmos-rust.git", branch = "xla/expand-types" }
cosmwasm-std        = { version = "0.16", default-features = false }
cosmwasm-bignumber  = { version = "2.2",  default-features = false }
futures             = { version = "0.3",  default-features = false, features = [ "async-await", "std" ] }
hex                 = { version = "0.4",  default-features = false }
hyper               = { version = "0.14", default-features = false }
itertools           = { version = "0.10", default-features = false }
zenith-rs           = { version = "0.1",  default-features = false, git = "https://github.com/meka-dev/zenith-rs.git" }
prometheus-client   = { version = "0.16", default-features = false }
serde               = { version = "1.0",  default-features = false, features = [ "derive", "rc" ] }
serde_json          = { version = "1.0",  default-features = false }
sha2                = { version = "0.10", default-features = false, features = [ "std" ] }
tendermint          = { version = "0.23", default-features = false }
tendermint-rpc      = { version = "0.23", default-features = true,  features = [ "websocket-client" ] }
tokio               = { version = "1.20", default-features = false, features = [ "macros", "rt-multi-thread", "sync", "time" ] }
tower-http          = { version = "0.3",  default-features = false, features = [ "trace" ] }
tracing             = { version = "0.1",  default-features = false, features = [ "attributes" ] }

address-book        = { version = "0.1",  default-features = false, path = "../address-book" }
arby                = { version = "0.1",  default-features = false, path = "../contracts/arby" }
chainrs             = { version = "0.1",  default-features = false, path = "../chainrs" }
common              = { version = "0.1",  default-features = false, path = "../common" }
lcd                 = { version = "0.1",  default-features = false, path = "../lcd" }
mekapi              = { version = "0.1",  default-features = false, path = "../mekapi" }
osmors              = { version = "0.1",  default-features = false, path = "../osmors" }
params-derive       = { version = "0.1",  default-features = false, path = "../params-derive" }
strategy            = { version = "0.1",  default-features = false, path = "../strategy" }
terrars             = { version = "0.1",  default-features = false, path = "../terrars" }
