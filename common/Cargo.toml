[package]
name    = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow              = { version = "1.0",  default-features = false, features = [ "std" ] }
async-trait         = { version = "0.1",  default-features = false }
axum                = { version = "0.5",  default-features = false, features = [ "headers", "http2", "matched-path", "tower-log" ] }
axum-extra          = { version = "0.3",  default-features = false }
bytes               = { version = "1.1",  default-features = false }
hostname            = { version = "0.3",  default-features = false }
hyper               = { version = "0.14", default-features = false }
futures-lite        = { version = "1.12", default-features = false, features = [ "std" ] }
lazy_static         = { version = "1.4",  default-features = false }
prometheus-client   = { version = "0.16", default-features = false }
reqwest             = { version = "0.11", default-features = false, features = [ "default-tls", "json", "rustls-tls", "stream" ] }
tame-gcs            = { version = "0.11", default-features = false, features = [ "async-multipart", "signing", "v1" ] }
tame-oauth          = { version = "0.7",  default-features = false, features = [ "gcp" ] }
tokio               = { version = "1.0",  default-features = false, features = [ "macros", "signal", "sync", "time" ] }
tower-http          = { version = "0.3",  default-features = false, features = [ "trace" ] }
tracing             = { version = "0.1",  default-features = false, features = [ "release_max_level_debug" ] }
tracing-subscriber  = { version = "0.3",  default-features = false, features = [ "env-filter", "fmt" ] }
